name: Release

# In valargroup/zecd, a version tag publishes the verified Linux packages as a
# GitHub Release. Pull requests and manual runs can build the same packages for
# inspection. The crates.io job is excluded in this fork.
#
# Cargo builds a static-musl binary on each native Linux runner. Each target
# ships a tarball and a Debian package. The release includes one SHA256SUMS
# file covering both architectures.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-deb.sh
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (with or without a leading v), e.g. 0.1.0 or v0.1.0-rc1"
        required: true
        default: "0.0.0-test"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the version/tag once so tag pushes and manual dispatch share one source of truth.
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) version="${INPUT_VERSION#v}" ;;
            pull_request) version="" ;;
            push) version="${GITHUB_REF_NAME#v}" ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == pull_request ||
                ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REPOSITORY" == valargroup/zecd ) ]]; then
            manifest_version="$(python3 -c 'import tomllib; print(tomllib.loads(open("Cargo.toml").read())["package"]["version"])')"
            if [[ "$GITHUB_EVENT_NAME" == push && "$version" != "$manifest_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must match the zecd package version (v$manifest_version)."
              exit 1
            fi
            version="$manifest_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version like 0.10.0 or 0.10.0-rc1."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Build and package one statically linked Linux binary.
  binary:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Fixed archive timestamps and a pinned Rust toolchain on both runners.
      SOURCE_DATE_EPOCH: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.commit }}
          persist-credentials: false

      - name: Install the native musl compiler and protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Build the static binary with Cargo
        env:
          TARGET: ${{ matrix.target }}
          TARGET_CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          RUSTFLAGS: "-C codegen-units=1 -C target-feature=+crt-static -C link-arg=-Wl,--build-id=none"
        run: |
          cargo build --locked --release --bin zecd --features mimalloc-secure --target "$TARGET"
          install -D -m 0755 "target/$TARGET/release/zecd" out/zecd

      - name: Verify static linking and smoke-test the binary
        run: |
          program_headers="$(readelf --program-headers --wide out/zecd)"
          dynamic_section="$(readelf --dynamic --wide out/zecd)"
          if [[ "$program_headers" == *INTERP* || "$dynamic_section" == *NEEDED* ]]; then
            echo "::error::Release binary has a dynamic interpreter or shared library dependency."
            exit 1
          fi
          ./out/zecd --version

      - name: Package tarball (reproducible)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          STAGE="zecd-${VERSION}-linux-${ARCH}"
          install -D -m 0755 out/zecd "$STAGE/zecd"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt zecd.example.toml "$STAGE/"
          # Reproducible tar: stable order, fixed mtime, root owner; gzip -n drops the
          # embedded name/timestamp.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf "$STAGE.tar" "$STAGE"
          gzip -9n "$STAGE.tar"

      - name: Build .deb (reproducible)
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-deb.sh out/zecd "$VERSION" "$ARCH" .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            zecd-*.tar.gz
            zecd_*.deb
          if-no-files-found: error
          overwrite: true

  # Assemble the same verified bundle for a PR, dry run, or tag.
  assemble:
    needs: [setup, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # One SHA256SUMS covering every arch's artifacts, in the standard `sha256sum` format
      # (verify with `sha256sum -c SHA256SUMS`, or `shasum -a 256 -c` on macOS/BSD). Generated
      # here rather than per-target so a single file covers amd64 + arm64. Filenames are bare
      # (cd dist) so the file verifies against downloads sitting in one directory, and the list
      # is sorted by filename for a byte-stable, reproducible SHA256SUMS.
      - name: Generate SHA256SUMS
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd dist
          archives=("zecd-$VERSION-linux-amd64.tar.gz" "zecd-$VERSION-linux-arm64.tar.gz")
          packages=("zecd_${VERSION}_amd64.deb" "zecd_${VERSION}_arm64.deb")
          sha256sum "${archives[@]}" "${packages[@]}" > SHA256SUMS
          sha256sum --strict --check SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/
          if-no-files-found: error
          overwrite: true

  release:
    needs: [setup, assemble]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.repository != 'valargroup/zecd')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist

      - name: Publish the Valargroup GitHub Release
        if: github.repository == 'valargroup/zecd'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.commit }}
        run: |
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)"
          if [[ "$tagged_commit" != "$COMMIT" ]]; then
            echo "::error::Tag $TAG no longer points to the verified build commit."
            exit 1
          fi
          cd dist
          sha256sum --strict --check SHA256SUMS
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" ./*.tar.gz ./*.deb SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" "${flags[@]}"

      - name: Create draft GitHub release
        if: github.repository != 'valargroup/zecd'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # Explicit so manual dispatch (which has no tag ref) targets the right release;
          # a draft does not create the git tag until it is published.
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/zecd-*.tar.gz
            dist/zecd_*.deb
            dist/SHA256SUMS

  # Publish the crate to crates.io. Tag pushes only: a manual dispatch is a packaging dry-run
  # and must never upload, since a crates.io version can be yanked but never deleted or
  # replaced. Ordered after `release` so a packaging or artifact failure surfaces first, while
  # everything upstream of it is still reversible. Release candidates are published too;
  # `cargo install` and a caret requirement both skip a prerelease unless asked for by version.
  crates-io:
    needs: [setup, release]
    if: github.event_name == 'push' && github.repository != 'valargroup/zecd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag names the version everywhere else in this workflow, so a manifest that
      # disagrees would publish under a number nothing else refers to.
      - name: Check the manifest version matches the tag
        run: |
          MANIFEST=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zecd") | .version')
          echo "manifest=${MANIFEST} tag=${{ needs.setup.outputs.version }}"
          if [ "${MANIFEST}" != "${{ needs.setup.outputs.version }}" ]; then
            echo "::error::Cargo.toml says ${MANIFEST}, the tag says ${{ needs.setup.outputs.version }}"
            exit 1
          fi

      # A missing token FAILS the job rather than skipping quietly. Publishing was a manual
      # step before this job existed, and it was simply forgotten for two releases while every
      # other artifact shipped normally; a silent skip here would reproduce that exactly.
      # Re-running the workflow on an already-published version is a no-op, not an error.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so ${VERSION} cannot be published"
            exit 1
          fi
          if curl -sf -H 'User-Agent: zecd-release-workflow' https://index.crates.io/ze/cd/zecd \
             | jq -e --arg v "${VERSION}" 'select(.vers == $v)' > /dev/null; then
            echo "zecd ${VERSION} is already on crates.io; nothing to do"
            exit 0
          fi
          cargo publish --locked
